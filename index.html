<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Excellence School Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6fb;--topbg:rgba(244,246,251,.88);--card:#fff;--card2:#f8f9fd;--hover:#f3f5fb;
  --ink:#1e2433;--muted:#6b7488;--line:#e5e9f2;
  --brand:#5b5fe0;--brand2:#8b5cf6;--ok:#12a36b;--warn:#d98a06;--bad:#e5484d;
  --shadow:0 1px 2px rgba(20,30,60,.06),0 10px 28px rgba(20,30,60,.07);
  --r:16px;--side:268px;
}
[data-theme=dark]{
  --bg:#0e1320;--topbg:rgba(14,19,32,.88);--card:#171d2d;--card2:#1c2337;--hover:#1e2639;
  --ink:#e8ecf6;--muted:#93a0ba;--line:#273049;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.28);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Inter','Cairo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;font-size:14.5px;-webkit-font-smoothing:antialiased}
[dir=rtl] body{font-family:'Cairo','Inter',system-ui,sans-serif}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.ic{width:18px;height:18px;flex:none}
small{color:var(--muted)}
.ms-auto{margin-inline-start:auto}

/* shell */
.shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:linear-gradient(180deg,#1b1f3b,#11152a);color:#cfd5ee;display:flex;flex-direction:column;padding:18px 14px;gap:16px;overflow:auto}
.brand{display:flex;gap:12px;align-items:center;padding:6px 8px}
.logo{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 8px 20px rgba(91,95,224,.5)}
.logo .ic{width:24px;height:24px}
.brand b{display:block;color:#fff;font-size:15px;line-height:1.25}
.brand small{color:#8f98c0;font-size:12px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;gap:12px;align-items:center;padding:11px 13px;border-radius:12px;font-weight:600;color:#b9c1e0;transition:.15s}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a.active{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 8px 20px rgba(91,95,224,.4)}
.side-foot{margin-top:auto;font-size:12px;color:#7b84ab;padding:8px}
.scrim{display:none;position:fixed;inset:0;background:rgba(5,8,20,.55);z-index:55}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;gap:12px;align-items:center;padding:12px 24px;background:var(--topbg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.menu{display:none}
.gsearch{flex:1;max-width:420px;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px;color:var(--muted)}
.gsearch input{border:0;background:none;outline:0;padding:10px 0;width:100%}
.top-actions{margin-inline-start:auto;display:flex;gap:8px}
.icon-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--card);display:inline-grid;place-items:center;cursor:pointer;color:var(--ink);transition:.15s}
.icon-btn:hover{border-color:var(--brand);color:var(--brand)}
.icon-btn.sm{width:32px;height:32px;border-radius:9px}
.icon-btn.bad:hover{border-color:var(--bad);color:var(--bad)}
.icon-btn.ok:hover{border-color:var(--ok);color:var(--ok)}
#view{padding:24px;max-width:1440px;width:100%;margin:0 auto}

/* page head */
.ph{display:flex;justify-content:space-between;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-bottom:20px}
.ph h1{font-size:26px;letter-spacing:-.4px;line-height:1.2}
.ph p{color:var(--muted);margin-top:2px}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:11px;border:1px solid transparent;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap}
.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 6px 16px rgba(91,95,224,.32)}
.btn.primary:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(91,95,224,.4)}
.btn.ghost{background:var(--card);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
.btn.danger{background:var(--bad);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.small{padding:7px 12px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:0;cursor:pointer;font-weight:700;text-align:start;color:var(--ink)}
.link:hover{color:var(--brand)}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;margin-bottom:18px}
.card.flush{padding:0;overflow:auto}
.card h3{font-size:16px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card h3 small{font-weight:500}
.filters{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:10px;padding:14px}
.filters.f3{grid-template-columns:2fr 1fr 1fr 1fr auto}
.filters input,.filters select,.fld input,.fld select,.fld textarea,.fld-inline{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);outline:0;transition:.15s}
.filters input:focus,.filters select:focus,.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(91,95,224,.15)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);display:flex;gap:14px;align-items:center}
.stat .bub{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff;flex:none;background:linear-gradient(135deg,var(--brand),var(--brand2))}
.stat .bub.g{background:linear-gradient(135deg,#12a36b,#34d399)}
.stat .bub.o{background:linear-gradient(135deg,#f59e0b,#fb923c)}
.stat .bub.r{background:linear-gradient(135deg,#e5484d,#f472b6)}
.stat .bub.b{background:linear-gradient(135deg,#0ea5e9,#6366f1)}
.stat b{display:block;font-size:22px;line-height:1.15;letter-spacing:-.3px}
.stat span{color:var(--muted);font-size:13px}
.dgrid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:18px}
.dgrid>div{min-width:0}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.cls-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.cls-card::before{content:'';position:absolute;inset-inline:0;top:0;height:4px;background:linear-gradient(90deg,var(--brand),var(--brand2))}
.cls-card h4{font-size:18px}
.cls-card .row{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}
.cls-card .row b{color:var(--ink)}
.cls-card .foot{display:flex;gap:6px;margin-top:auto;align-items:center}

/* tables */
.tbl{width:100%;border-collapse:collapse;min-width:640px}
.tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);text-align:start;padding:13px 14px;background:var(--card2);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:var(--hover)}
.tbl .num{text-align:end;font-variant-numeric:tabular-nums}
.tbl .acts{display:flex;gap:6px;justify-content:flex-end}
.tbl tfoot td{background:var(--card2);font-weight:700}
.who{display:flex;gap:12px;align-items:center;min-width:0}
.who small{display:block}
.av{width:38px;height:38px;border-radius:50%;object-fit:cover;display:inline-grid;place-items:center;font-weight:700;font-size:13px;color:#fff;background:hsl(var(--h,230) 62% 52%);flex:none}
.av.lg{width:72px;height:72px;font-size:22px}
.av.xl{width:84px;height:84px;font-size:26px}
.av.sm{width:28px;height:28px;font-size:11px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.chip.paid{background:rgba(18,163,107,.14);color:var(--ok)}
.chip.partial{background:rgba(217,138,6,.16);color:var(--warn)}
.chip.unpaid{background:rgba(229,72,77,.14);color:var(--bad)}
.chip.none{background:var(--hover);color:var(--muted)}
.chip.info{background:rgba(91,95,224,.14);color:var(--brand)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--brand2))}
.bar.ok i{background:linear-gradient(90deg,#12a36b,#34d399)}
.feecell{min-width:150px}
.feecell small{display:block;margin-top:4px}

/* charts */
.donut-wrap{display:flex;align-items:center;gap:20px}
.donut{--p:0;width:130px;height:130px;border-radius:50%;background:conic-gradient(var(--brand) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.donut>div{width:98px;height:98px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center;line-height:1.1}
.donut b{font-size:24px;display:block}
.donut small{font-size:11px}
.legend{display:flex;flex-direction:column;gap:8px;font-size:13px}
.legend div{display:flex;justify-content:space-between;gap:14px}
.cols{display:flex;gap:12px;align-items:flex-end;height:190px;padding-top:10px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;min-width:0}
.col .tr{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
.col i{display:block;width:min(46px,70%);border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,var(--brand2),var(--brand));min-height:3px}
.col em{font-style:normal;font-size:11px;color:var(--muted)}
.col small{font-size:12px}
.hbar{display:grid;grid-template-columns:110px 1fr 36px;gap:10px;align-items:center;margin-bottom:10px;font-size:13px}
.hbar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar b{text-align:end}
.mini-list{display:flex;flex-direction:column}
.mini-list .it{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.mini-list .it:last-child{border-bottom:0}
.mini-list .it .grow{flex:1;min-width:0}
.mini-list .it b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}

/* empty */
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty .ic{width:46px;height:46px;opacity:.45;margin-bottom:10px}
.empty h3{color:var(--ink);justify-content:center;margin-bottom:6px;font-size:18px}
.empty .acts{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.hero{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-radius:22px;padding:38px;margin-bottom:18px;box-shadow:0 18px 40px rgba(91,95,224,.35)}
.hero h2{font-size:28px;margin-bottom:6px}
.hero p{opacity:.9;max-width:560px}
.hero .acts{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.hero .btn.ghost{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3);color:#fff}
.hero .btn.white{background:#fff;color:var(--brand)}

/* forms */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.span2{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:6px}
.fld>span{font-size:12.5px;font-weight:600;color:var(--muted)}
.req{color:var(--bad)}
.fld textarea{resize:vertical;min-height:70px}
.photo-row{display:flex;gap:16px;align-items:center;margin-bottom:16px}
.photo-row .btns{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:8px 16px;border-radius:9px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--brand);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.bar-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar-row select,.bar-row input{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);outline:0}
.month-nav{display:flex;gap:6px;align-items:center}
.month-nav b{min-width:140px;text-align:center}
.set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px}
.help{color:var(--muted);font-size:12.5px;margin-top:4px}
.danger-zone{border-color:rgba(229,72,77,.4)}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(8,12,28,.6);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:100;padding:16px;animation:fade .15s}
.overlay.confirm{z-index:200}
.modal{background:var(--card);border-radius:20px;width:100%;max-width:560px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.4);animation:pop .18s;border:1px solid var(--line)}
.modal.wide{max-width:780px}
.modal.sm{max-width:420px}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}
.modal-h h3{font-size:18px}
.modal form{display:flex;flex-direction:column;min-height:0;flex:1}
.modal-b{padding:22px;overflow:auto;flex:1}
.modal-f{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px;border-top:1px solid var(--line);margin:22px -22px -22px}
.modal.sm .modal-b{padding:24px}
.confirm-msg{font-size:15.5px;line-height:1.6}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}
.toasts{position:fixed;bottom:20px;inset-inline-end:20px;display:flex;flex-direction:column;gap:8px;z-index:300}
.toast{background:#1b1f3b;color:#fff;padding:12px 18px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.35);border-inline-start:4px solid var(--ok);animation:pop .2s;max-width:340px}
.toast.warn{border-color:var(--warn)}.toast.err{border-color:var(--bad)}
.toast.out{opacity:0;transition:.4s}

/* profile */
.prof-h{display:flex;gap:18px;align-items:center;margin-bottom:18px}
.prof-h h2{font-size:22px}
.kvs{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:18px}
.kv{background:var(--card2);border-radius:12px;padding:10px 14px}
.kv small{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px}
.kv b{font-weight:600;word-break:break-word}
.fee-box{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:8px}
.fee-box div{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.fee-box b{display:block;font-size:18px}
.row-h{display:flex;justify-content:space-between;align-items:center;margin:18px 0 8px}
.pay-sum{display:flex;gap:12px;align-items:center;background:var(--card2);padding:12px 14px;border-radius:12px;margin-bottom:16px}
.pay-sum small{display:block}

/* attendance */
.att-wrap{overflow:auto;max-height:calc(100vh - 260px)}
.att{border-collapse:separate;border-spacing:0;font-size:12px;width:max-content;min-width:100%}
.att th,.att td{border-bottom:1px solid var(--line);border-inline-end:1px solid var(--line);text-align:center;padding:0;height:36px}
.att thead th{position:sticky;top:0;background:var(--card2);z-index:3;font-weight:600}
.att .nm{position:sticky;inset-inline-start:0;background:var(--card);z-index:2;text-align:start;padding:0 12px;min-width:180px;font-weight:600;white-space:nowrap}
.att thead .nm{z-index:4;background:var(--card2)}
.att .d{width:34px;min-width:34px}
.att .dbtn{width:100%;height:100%;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;padding:4px 0}
.att .dbtn:hover{background:rgba(91,95,224,.12)}
.att .dbtn small{font-size:9.5px}
.att .d small{display:block;font-size:9.5px}
.att td.d.p{background:rgba(18,163,107,.15)}
.att .off{background:var(--hover);color:var(--muted)}
.att td.off.p{background:rgba(18,163,107,.15)}
.att th.today{box-shadow:inset 0 -3px 0 var(--brand);color:var(--brand)}
.att input{width:16px;height:16px;accent-color:var(--ok);cursor:pointer}
.att .st{min-width:54px;font-weight:700;padding:0 8px}
.att .sp{color:var(--ok)}.att .sa{color:var(--bad)}.att .spc{color:var(--brand)}
.att tr:hover td{background-color:var(--hover)}
.att tr:hover .nm{background:var(--hover)}

/* timetable */
.tt{table-layout:fixed;min-width:820px;border-collapse:separate;border-spacing:0}
.tt th{background:var(--card2);padding:12px 8px;font-size:12px;text-align:center;border-bottom:1px solid var(--line)}
.tt th.pl{width:110px;font-size:12.5px;color:var(--muted);border-inline-end:1px solid var(--line)}
.tt td{padding:6px;border-bottom:1px solid var(--line);border-inline-end:1px solid var(--line);vertical-align:top}
.tt .tt-s,.tt .tt-t{width:100%;border:1px solid transparent;background:var(--card2);padding:7px 8px;border-radius:8px;outline:0;font-size:13px;margin-bottom:4px}
.tt .tt-s{font-weight:600}
.tt .tt-t{font-size:12px;color:var(--muted)}
.tt .tt-s:focus,.tt .tt-t:focus{border-color:var(--brand);background:var(--card)}
.tt td.conflict{background:rgba(229,72,77,.12)}
.tt td.conflict .tt-t{color:var(--bad);font-weight:700}
.tts td{height:58px;text-align:center;font-size:13px}
.tts td b{display:block}
.tts th.pl{background:var(--card2)}
.note{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:12px;background:rgba(91,95,224,.1);color:var(--brand);font-size:13px;margin-bottom:14px}

/* receipt / print */
.receipt{background:#fff;color:#111;border:2px solid #222;border-radius:12px;padding:26px;max-width:640px;margin:0 auto;font-family:'Inter','Cairo',sans-serif}
.rc-h{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid #222;padding-bottom:14px;margin-bottom:16px}
.rc-h h2{font-size:22px;color:#333}
.rc-h small{color:#555}
.rc-no{text-align:end;font-weight:700}
.receipt table{width:100%;border-collapse:collapse;margin-bottom:16px}
.receipt td{padding:8px 4px;border-bottom:1px dashed #bbb}
.receipt td:first-child{color:#555;width:38%}
.rc-total{display:flex;justify-content:space-between;font-size:20px;font-weight:800;background:#f1f1f1;padding:12px 16px;border-radius:8px;margin-bottom:14px}
.rc-sign{display:flex;justify-content:space-between;margin-top:42px;font-size:12px;color:#555}
.rc-sign span{border-top:1px solid #333;padding-top:6px;min-width:140px;text-align:center}
.print-h{text-align:center;margin-bottom:14px;color:#111}
.print-h h2{font-size:20px}
#printArea{display:none}
@media print{
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;color:#000}
  body{background:#fff}
  .tbl th,.tbl td,.att th,.att td{color:#000;border:1px solid #999!important;background:#fff!important}
  .att{font-size:9px}
  .att .nm{position:static}
  .receipt{border-color:#000}
}

/* responsive */
@media (max-width:1100px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dgrid{grid-template-columns:1fr}
  .filters,.filters.f3{grid-template-columns:1fr 1fr}
  .filters input:first-child{grid-column:1/-1}
}
@media (max-width:980px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;inset-block:0;inset-inline-start:0;width:280px;z-index:60;transform:translateX(-102%);transition:transform .25s}

/* ---------- data ---------- */
let migrated=false;
const blank=()=>({v:2,seq:0,settings:{school:'Excellence English Academy',currency:'SDG',lang:'en',theme:'light',week:'sun',periods:[...PERIODS]},classes:[],teachers:[],subjects:[],students:[],attendance:{students:{},teachers:{}},timetable:{}});
function merge(r){
  const d=blank();
  Object.assign(d.settings,r.settings||{});
  if(!Array.isArray(d.settings.periods)||!d.settings.periods.length)d.settings.periods=[...PERIODS];
  const arr=k=>Array.isArray(r[k])?r[k].filter(x=>x&&typeof x==='object'):[];
  const S_=v=>String(v??'');
  d.classes=arr('classes').map(c=>({id:S_(c.id||uid()),name:S_(c.name),teacherId:c.teacherId?S_(c.teacherId):''}));
  d.teachers=arr('teachers').map(x=>({id:S_(x.id||uid()),name:S_(x.name),phone:S_(x.phone),email:S_(x.email),subject:S_(x.subject),salary:+x.salary||0}));
  d.subjects=arr('subjects').map(x=>({id:S_(x.id||uid()),name:S_(x.name),code:S_(x.code)}));
  d.students=arr('students').map(s=>({id:S_(s.id||uid()),name:S_(s.name),classId:S_(s.classId),gender:S_(s.gender),age:s.age?(+s.age||''):'',phone:S_(s.phone),parent:S_(s.parent),grade:+s.grade||0,fee:+s.fee||0,live:S_(s.live),joined:S_(s.joined),health:S_(s.health),photo:/^data:image\//.test(s.photo||'')?s.photo:'',payments:(Array.isArray(s.payments)?s.payments:[]).filter(Boolean).map(p=>({id:S_(p.id||uid()),no:+p.no||0,date:S_(p.date||today()).slice(0,10),amount:+p.amount||0,method:S_(p.method||'Cash'),note:S_(p.note)}))}));
  ['students','teachers'].forEach(k=>{const a=r.attendance&&r.attendance[k];d.attendance[k]=a&&typeof a==='object'?a:{};});
  d.timetable=r.timetable&&typeof r.timetable==='object'?r.timetable:{};
  d.seq=Math.max(+r.seq||0,...d.students.flatMap(s=>s.payments.map(p=>p.no)),0);
  return d;
}
function migrate(){
  try{
    const g=k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch{return null}};
    const oc=g('classes'),os=g('students'),ot=g('teachers'),osub=g('subjects'),ott=g('timetable');
    if(![oc,os,ot,osub].some(x=>Array.isArray(x)&&x.length))return null;
    const d=blank(),cmap={};
    (oc||[]).forEach(c=>{const id=uid();cmap[c.name]=id;d.classes.push({id,name:String(c.name||''),teacherId:c.teacherId?String(c.teacherId):''});});
    (ot||[]).forEach(x=>d.teachers.push({id:String(x.id||uid()),name:x.name||'',phone:x.phone||'',email:x.email||'',subject:x.subject||'',salary:+x.salary||0}));
    (osub||[]).forEach(x=>d.subjects.push({id:uid(),name:x.name||'',code:x.code||''}));
    (os||[]).filter(s=>!s.deleted).forEach(s=>{
      let cid=cmap[s.class];
      if(!cid){cid=uid();cmap[s.class]=cid;d.classes.push({id:cid,name:String(s.class||'Class'),teacherId:''});}
      const pays=(s.paymentHistory||[]).map(p=>({id:uid(),no:++d.seq,date:String(p.date||'').slice(0,10)||today(),amount:+p.amount||0,method:'Cash',note:p.comment||''}));
      const diff=(+s.paid||0)-sum(pays,p=>p.amount);
      if(diff>0)pays.unshift({id:uid(),no:++d.seq,date:s.date||today(),amount:diff,method:'Cash',note:'Opening balance'});
      d.students.push({id:String(s.id||uid()),name:s.name||'',classId:cid,gender:s.gender||'',age:s.age||'',phone:s.phone||'',parent:s.parentName||'',grade:+s.grade||0,fee:+s.fee||0,live:s.live||'',joined:s.date||'',health:s.illness||'',photo:(s.photo&&/^data:image\//.test(s.photo))?s.photo:'',payments:pays});
    });
    if(ott&&typeof ott==='object'){
      const names={monday:'mon',tuesday:'tue',wednesday:'wed',thursday:'thu',friday:'fri'};const per=new Set();
      Object.keys(ott).forEach(k=>{
        const cn=k.replace(/^tt_/,''),cid=cmap[cn];if(!cid)return;
        d.timetable[cid]={};
        Object.entries(ott[k]||{}).forEach(([ck,v])=>{
          const i=ck.indexOf('-'),day=names[ck.slice(0,i).toLowerCase()],p=ck.slice(i+1);
          if(day&&v){per.add(p);d.timetable[cid][`${day}|${p}`]={s:String(v),t:''};}
        });
      });
      if(per.size){d.settings.periods=[...per];d.settings.week='mon';}
    }
    migrated=true;return d;
  }catch(e){return null}
}
function load(){
  try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&r.v===2)return merge(r);}catch{}
  const m=migrate();if(m){try{localStorage.setItem(KEY,JSON.stringify(m))}catch{}return m}
  return blank();
}
let db=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast(t('Storage is full. Export a backup and remove some photos.'),'err')}}

const fmtDate=s=>{if(!s)return '—';const d=new Date(String(s).length<=10?s+'T00:00:00':s);return isNaN(d)?'—':d.toLocaleDateString(loc(),{day:'numeric',month:'short',year:'numeric'})};

function modal({title,html,wide,foot=true,onSubmit,submit,onMount}){
  closeModal();
  const el=document.createElement('div');el.className='overlay';
  el.innerHTML=`<div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true"><div class="modal-h"><h3>${esc(title)}</h3><button type="button" class="icon-btn sm" data-close aria-label="Close">${ic('x')}</button></div><form class="modal-b">${html}${foot?`<div class="modal-f"><button type="button" class="btn ghost" data-close>${t('Cancel')}</button><button class="btn primary">${submit||t('Save')}</button></div>`:''}</form></div>`;
  document.body.appendChild(el);document.body.classList.add('noscroll');
  const form=$('form',el);
  form.addEventListener('submit',async e=>{e.preventDefault();if(!onSubmit)return;const d=Object.fromEntries(new FormData(form));const ok=await onSubmit(d,form);if(ok!==false)closeModal();});
  el.addEventListener('mousedown',e=>{if(e.target===el)closeModal()});
  if(onMount)onMount(el,form);
  const first=form.querySelector('[autofocus]')||form.querySelector('input:not([type=hidden]):not([type=file]),select');
  if(first&&foot)first.focus();
  return el;
}
function closeModal(){$$('.overlay:not(.confirm)').forEach(x=>x.remove());if(!$('.overlay'))document.body.classList.remove('noscroll');}
function confirmBox(msg,o={}){
  return new Promise(res=>{
    const el=document.createElement('div');el.className='overlay confirm';
    el.innerHTML=`<div class="modal sm"><div class="modal-b"><p class="confirm-msg">${esc(msg)}</p><div class="modal-f"><button type="button" class="btn ghost" data-v="0">${t('Cancel')}</button><button type="button" class="btn ${o.danger===false?'primary':'danger'}" data-v="1">${esc(o.ok||t('Delete'))}</button></div></div></div>`;
    document.body.appendChild(el);document.body.classList.add('noscroll');
    el.addEventListener('click',e=>{const v=e.target.closest('[data-v]');if(v||e.target===el){el.remove();if(!$('.overlay'))document.body.classList.remove('noscroll');res(!!v&&v.dataset.v==='1');}});
  });
}
function toast(msg,type='ok'){
  const w=$('#toasts');if(!w)return;
  const el=document.createElement('div');el.className='toast '+(type==='ok'?'':type);el.textContent=msg;w.appendChild(el);
  setTimeout(()=>el.classList.add('out'),2800);setTimeout(()=>el.remove(),3300);
}

function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);}
function csv(rows,name){
  const cell=c=>{let v=c==null?'':c;if(typeof v==='string'&&/^[=+\-@]/.test(v))v="'"+v;return `"${String(v).replace(/"/g,'""')}"`};
  download(new Blob(['\ufeff'+rows.map(r=>r.map(cell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),name);
}
function resizeImg(file,size){
  return new Promise((res,rej)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');const m=Math.min(img.width,img.height);x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,size,size);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.78));};
    img.onerror=rej;img.src=url;
  });
}
